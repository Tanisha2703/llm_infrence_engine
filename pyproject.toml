[project]
name = "miniserve"
version = "0.1.0"
description = "A from-scratch LLM inference engine: KV cache, continuous batching, paged prefix cache, speculative decoding."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
eval = ["pyarrow>=15"]  # WikiText-2 parquet files for the perplexity evaluation
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
    "httpx>=0.27",  # load tester and the server tests
]
modal = ["modal>=0.64"]  # run the benchmarks on a rented GPU (Stage 7)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["heavy: needs several GB of extra RAM (loads a second, larger model); deselect with -m \"not heavy\""]
