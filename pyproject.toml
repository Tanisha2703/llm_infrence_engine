[project]
name = "miniserve"
version = "0.1.0"
description = "A from-scratch LLM inference engine: KV cache, continuous batching, paged prefix cache, speculative decoding."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
